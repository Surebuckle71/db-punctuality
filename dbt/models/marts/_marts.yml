version: 2

models:
  - name: fct_delay_locations
    description: >
      One row per month and location (directed track segment or station stop),
      with the delay minutes long-distance trains gained and recovered there.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [service_month, location_id]
    columns:
      - name: location_id
        data_tests: [not_null]
      - name: location_type
        data_tests:
          - accepted_values:
              arguments:
                values: [track, station]
      - name: location_name
        data_tests: [not_null]
      - name: n_train_passes
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: minutes_gained
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: minutes_recovered
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                max_value: 0

  - name: fct_delay_by_phase
    description: >
      Delay added while running vs while standing at stations, per day and train type,
      with the scheduled minutes of each phase for normalisation.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [service_date, train_type, phase]
    columns:
      - name: service_date
        data_tests: [not_null]
      - name: phase
        data_tests:
          - accepted_values:
              arguments:
                values: [running, at_station]
      - name: scheduled_min
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
