[project]
name = "db-punctuality"
version = "0.1.0"
description = "Where do German long-distance trains lose time? A SQL-first analysis of Deutsche Bahn delays."
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0",
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "huggingface-hub>=2.0.0",
    "pandas>=3.0.6",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
